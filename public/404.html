<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Frame</title>
    <script>
      // GitHub Pages はSPAの深いURL（例 /frame-dev/photo-contest/2026）で404を返すため、
      // パスをクエリ（/?/photo-contest/2026）へ変換して index.html へリダイレクトし、
      // index.html 側のスクリプトで元のURLへ復元する（spa-github-pages方式）。
      // pathSegmentsToKeep=1: プロジェクトページのリポジトリ名（/frame-dev/）を保持する。
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
